services:
  devhub:
    image: debian:bookworm-slim
    working_dir: /workspace
    command: ["bash", "-lc", "PORT=8090 CMS_STORE=memory ./.devhub/devhub"]
    volumes:
      - .:/workspace

  admin-e2e:
    build:
      context: ./web/admin-app
      dockerfile: Dockerfile.e2e
    working_dir: /workspace/web/admin-app
    depends_on:
      - devhub
    environment:
      DEVHUB_E2E_ORIGIN: ${DEVHUB_E2E_ORIGIN:-http://devhub:8090}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/workspace
      - admin_e2e_node_modules:/workspace/web/admin-app/node_modules

  frontend-e2e:
    build:
      context: ./web/frontend-app
      dockerfile: Dockerfile.e2e
    working_dir: /workspace/web/frontend-app
    depends_on:
      - devhub
    environment:
      DEVHUB_E2E_ORIGIN: ${DEVHUB_E2E_ORIGIN:-http://devhub:8090}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/workspace
      - frontend_e2e_node_modules:/workspace/web/frontend-app/node_modules

volumes:
  admin_e2e_node_modules:
  frontend_e2e_node_modules:
