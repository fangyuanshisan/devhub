name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o /tmp/devhub .

      - name: SQL and docs presence
        run: |
          test -f db/mysql/001_schema.sql
          test -f README.md
          test -f docs/README.md
          test -f docs/API.md
          test -f docs/TESTING.md
          test -f docs/DEPLOYMENT.md
          test -f docs/SEO.md
          test -f docs/PROJECT_PROGRESS.md
          test -f docs/BACKUP_AND_ROLLBACK.md
          test -f docs/releases/v1.0.0.md
          test -f CHANGELOG.md
          test -f VERSION
          grep -qx 'v1.0.0' VERSION

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/frontend-app/package-lock.json

      - name: Install
        working-directory: web/frontend-app
        run: npm ci

      - name: Build
        working-directory: web/frontend-app
        env:
          FRONTEND_SITE_URL: http://127.0.0.1:8090
        run: npm run build

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/admin-app/package-lock.json

      - name: Install
        working-directory: web/admin-app
        run: npm ci

      - name: Build
        working-directory: web/admin-app
        run: npm run build
